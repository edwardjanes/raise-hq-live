<div id="raisehq-profile-investors">
  <style>
    #raisehq-profile-investors {
      --rhq-black: #000000;
      --rhq-surface: #111111;
      --rhq-green: #00FF84;
      --rhq-text: #E8E8E8;
      --rhq-muted: #A0A0A0;
      --rhq-white: #FFFFFF;
      --rhq-error: #FF4D4D;

      font-family: 'Montserrat', sans-serif;
      background: var(--rhq-black);
      color: var(--rhq-text);
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 28px 36px;
      border-radius: 4px;
      box-sizing: border-box;
    }
    #raisehq-profile-investors * { box-sizing: border-box; }
    #raisehq-profile-investors .rhq-eyebrow {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--rhq-muted);
      margin: 0 0 6px;
    }
    #raisehq-profile-investors .rhq-h1 {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--rhq-white);
      margin: 0 0 24px;
    }

    #raisehq-profile-investors .rhq-meter {
      background: var(--rhq-surface);
      border-left: 2px solid var(--rhq-green);
      padding: 18px 22px;
      margin-bottom: 24px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    #raisehq-profile-investors .rhq-meter-figure {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      font-size: 40px;
      line-height: 1;
      color: var(--rhq-green);
    }
    #raisehq-profile-investors .rhq-meter-figure.rhq-zero { color: var(--rhq-muted); }
    #raisehq-profile-investors .rhq-meter-label { font-size: 14px; color: var(--rhq-muted); margin-top: 4px; }
    #raisehq-profile-investors .rhq-meter-client { font-size: 14px; color: var(--rhq-muted); text-align: right; }
    #raisehq-profile-investors .rhq-meter-client strong {
      display: block; font-family: 'Inter', sans-serif; font-weight: 600; color: var(--rhq-text); font-size: 16px;
    }

    #raisehq-profile-investors .rhq-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    #raisehq-profile-investors .rhq-toolbar-left { font-size: 13px; color: var(--rhq-muted); }
    #raisehq-profile-investors .rhq-link-btn {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--rhq-green);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    #raisehq-profile-investors .rhq-link-btn:disabled { color: var(--rhq-muted); cursor: not-allowed; }

    #raisehq-profile-investors .rhq-list {
      max-height: 360px;
      overflow-y: auto;
      border: 1px solid var(--rhq-surface);
      border-radius: 3px;
      margin-bottom: 20px;
    }
    #raisehq-profile-investors .rhq-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--rhq-surface);
    }
    #raisehq-profile-investors .rhq-row:last-child { border-bottom: none; }
    #raisehq-profile-investors .rhq-row input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: var(--rhq-green);
      cursor: pointer;
      flex-shrink: 0;
    }
    #raisehq-profile-investors .rhq-row input[type="checkbox"]:disabled { cursor: not-allowed; opacity: 0.4; }
    #raisehq-profile-investors .rhq-row-main { flex: 1; min-width: 0; }
    #raisehq-profile-investors .rhq-row-name {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      color: var(--rhq-white);
    }
    #raisehq-profile-investors .rhq-row-email { font-size: 12px; color: var(--rhq-muted); margin-top: 2px; }
    #raisehq-profile-investors .rhq-badge {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 3px 10px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    #raisehq-profile-investors .rhq-badge.rhq-badge-done {
      color: var(--rhq-muted);
      border: 1px solid var(--rhq-muted);
      background: transparent;
    }
    #raisehq-profile-investors .rhq-badge.rhq-badge-pending {
      color: var(--rhq-green);
      border: 1px solid var(--rhq-green);
      background: transparent;
    }

    #raisehq-profile-investors .rhq-empty {
      padding: 24px 16px;
      color: var(--rhq-muted);
      font-size: 14px;
      text-align: center;
    }

    #raisehq-profile-investors .rhq-submit {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--rhq-green);
      color: var(--rhq-black);
      border: none;
      padding: 14px 28px;
      border-radius: 3px;
      cursor: pointer;
      transition: opacity .15s ease;
    }
    #raisehq-profile-investors .rhq-submit:hover { opacity: 0.88; }
    #raisehq-profile-investors .rhq-submit:disabled {
      background: var(--rhq-surface);
      color: var(--rhq-muted);
      cursor: not-allowed;
    }

    #raisehq-profile-investors .rhq-status { font-size: 14px; color: var(--rhq-muted); margin-top: 14px; }
    #raisehq-profile-investors .rhq-status.rhq-error { color: var(--rhq-error); }

    #raisehq-profile-investors .rhq-results {
      margin-top: 28px;
      border-top: 1px solid var(--rhq-surface);
      padding-top: 20px;
    }
    #raisehq-profile-investors .rhq-results-summary {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: var(--rhq-white);
      margin-bottom: 8px;
    }
    #raisehq-profile-investors .rhq-results-detail { font-size: 13px; color: var(--rhq-muted); }

    #raisehq-profile-investors .rhq-footer {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      color: var(--rhq-muted);
      margin-top: 28px;
      text-align: center;
    }

    @media (max-width: 480px) {
      #raisehq-profile-investors .rhq-h1 { font-size: 22px; }
      #raisehq-profile-investors .rhq-meter-figure { font-size: 32px; }
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <p class="rhq-eyebrow">Raise HQ · Investor Data</p>
  <h1 class="rhq-h1">Profile Investors</h1>

  <div class="rhq-meter">
    <div>
      <div class="rhq-meter-figure" id="rhq-credits-figure">—</div>
      <div class="rhq-meter-label">credits available</div>
    </div>
    <div class="rhq-meter-client">
      <strong id="rhq-client-name">—</strong>
      1 credit per investor profiled
    </div>
  </div>

  <div class="rhq-toolbar">
    <span class="rhq-toolbar-left" id="rhq-selected-count">0 selected</span>
    <button type="button" class="rhq-link-btn" id="rhq-select-all">Select all unprofiled</button>
  </div>

  <div class="rhq-list" id="rhq-list">
    <div class="rhq-empty" id="rhq-loading">Loading investors…</div>
  </div>

  <button class="rhq-submit" id="rhq-submit" disabled>Profile Selected</button>
  <div class="rhq-status" id="rhq-status"></div>

  <div class="rhq-results" id="rhq-results" style="display:none;">
    <div class="rhq-results-summary" id="rhq-results-summary"></div>
    <div class="rhq-results-detail" id="rhq-results-detail"></div>
  </div>

  <p class="rhq-footer">Raise HQ is a Source Capital product.</p>
</div>

<script>
(function () {
  var ROOT = document.getElementById('raisehq-profile-investors');
  if (!ROOT) return;

  var DEFAULT_CLIENT = 'Test Client Co';
  var BASE_URL = 'https://n8n.srv926257.hstgr.cloud/webhook';

  var params = new URLSearchParams(window.location.search);
  var clientName = params.get('client') || DEFAULT_CLIENT;

  var currentCredits = 0;
  var investors = [];
  var selected = {};

  var creditsFigure = ROOT.querySelector('#rhq-credits-figure');
  var clientNameEl = ROOT.querySelector('#rhq-client-name');
  var listEl = ROOT.querySelector('#rhq-list');
  var loadingEl = ROOT.querySelector('#rhq-loading');
  var selectedCountEl = ROOT.querySelector('#rhq-selected-count');
  var selectAllBtn = ROOT.querySelector('#rhq-select-all');
  var submitBtn = ROOT.querySelector('#rhq-submit');
  var statusEl = ROOT.querySelector('#rhq-status');
  var resultsEl = ROOT.querySelector('#rhq-results');
  var resultsSummaryEl = ROOT.querySelector('#rhq-results-summary');
  var resultsDetailEl = ROOT.querySelector('#rhq-results-detail');

  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.className = 'rhq-status' + (isError ? ' rhq-error' : '');
  }

  function selectedIds() {
    return Object.keys(selected).filter(function (id) { return selected[id]; });
  }

  function updateToolbar() {
    var count = selectedIds().length;
    selectedCountEl.textContent = count + ' selected';
    submitBtn.disabled = count === 0 || count > currentCredits || currentCredits <= 0;
    if (count > currentCredits) {
      setStatus('You only have ' + currentCredits + ' credits available — deselect some investors.', true);
    } else if (statusEl.textContent.indexOf('deselect') !== -1) {
      setStatus('', false);
    }
  }

  function renderBalance(credits, client) {
    currentCredits = credits;
    creditsFigure.textContent = credits;
    creditsFigure.className = 'rhq-meter-figure' + (credits <= 0 ? ' rhq-zero' : '');
    clientNameEl.textContent = client;
    updateToolbar();
  }

  function renderList() {
    listEl.innerHTML = '';
    if (!investors.length) {
      var empty = document.createElement('div');
      empty.className = 'rhq-empty';
      empty.textContent = 'No investors found for this client yet. Pull some investors first.';
      listEl.appendChild(empty);
      return;
    }

    investors.forEach(function (inv) {
      var row = document.createElement('div');
      row.className = 'rhq-row';

      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.disabled = inv.profiled;
      checkbox.checked = !!selected[inv.contactId];
      checkbox.addEventListener('change', function () {
        selected[inv.contactId] = checkbox.checked;
        if (checkbox.checked && selectedIds().length > currentCredits) {
          checkbox.checked = false;
          selected[inv.contactId] = false;
          setStatus('You only have ' + currentCredits + ' credits available.', true);
        }
        updateToolbar();
      });
      row.appendChild(checkbox);

      var main = document.createElement('div');
      main.className = 'rhq-row-main';
      var nameEl = document.createElement('div');
      nameEl.className = 'rhq-row-name';
      nameEl.textContent = inv.name || 'Unnamed';
      var emailEl = document.createElement('div');
      emailEl.className = 'rhq-row-email';
      emailEl.textContent = inv.email || 'No email on file';
      main.appendChild(nameEl);
      main.appendChild(emailEl);
      row.appendChild(main);

      var badge = document.createElement('span');
      badge.className = 'rhq-badge ' + (inv.profiled ? 'rhq-badge-done' : 'rhq-badge-pending');
      badge.textContent = inv.profiled ? 'Profiled' : 'Not profiled';
      row.appendChild(badge);

      listEl.appendChild(row);
    });
  }

  function loadInvestors() {
    fetch(BASE_URL + '/list-client-investors?client_name=' + encodeURIComponent(clientName))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.success) {
          loadingEl.textContent = data.error || 'Could not load investors.';
          return;
        }
        investors = data.investors || [];
        renderList();
      })
      .catch(function () {
        loadingEl.textContent = 'Could not reach Raise HQ. Check your connection and try again.';
      });
  }

  function loadBalance() {
    fetch(BASE_URL + '/credit-balance?client_name=' + encodeURIComponent(clientName))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.success) {
          setStatus('No client found matching "' + clientName + '".', true);
          return;
        }
        renderBalance(data.credits, data.client);
      })
      .catch(function () {
        setStatus('Could not reach Raise HQ. Check your connection and try again.', true);
      });
  }

  selectAllBtn.addEventListener('click', function () {
    var unselectedUnprofiled = investors.filter(function (inv) { return !inv.profiled && !selected[inv.contactId]; });
    var room = Math.max(currentCredits - selectedIds().length, 0);
    var toSelect = unselectedUnprofiled.slice(0, room);
    toSelect.forEach(function (inv) { selected[inv.contactId] = true; });

    if (unselectedUnprofiled.length > room) {
      setStatus('Selected ' + toSelect.length + ' — only ' + currentCredits + ' credits available in total.', true);
    }
    renderList();
    updateToolbar();
  });

  submitBtn.addEventListener('click', function () {
    var ids = selectedIds();
    if (!ids.length) return;
    if (ids.length > currentCredits) {
      setStatus('You only have ' + currentCredits + ' credits available.', true);
      return;
    }

    submitBtn.disabled = true;
    setStatus('Profiling ' + ids.length + ' investor' + (ids.length === 1 ? '' : 's') + '… this can take a moment.', false);
    resultsEl.style.display = 'none';

    fetch(BASE_URL + '/profile-investors', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ client_name: clientName, contact_ids: ids })
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.data.success) {
          setStatus("That run didn't go through — " + (res.data.error === 'insufficient_credits' ? "you're out of credits." : res.data.error), true);
          if (typeof res.data.credits_remaining === 'number') renderBalance(res.data.credits_remaining, clientName);
          return;
        }
        setStatus('', false);
        renderBalance(res.data.credits_after, res.data.client);

        selected = {};
        resultsEl.style.display = 'block';
        resultsSummaryEl.textContent = 'Profiled ' + res.data.profiled + ' of ' + res.data.requested + ' requested.';
        var detailParts = [];
        if (res.data.skipped) detailParts.push(res.data.skipped + ' already had a fit score and were skipped free of charge.');
        if (res.data.errors) detailParts.push(res.data.errors + ' could not be parsed and were not charged.');
        resultsDetailEl.textContent = detailParts.join(' ');

        loadInvestors();
      })
      .catch(function () {
        setStatus('Could not reach Raise HQ. Check your connection and try again.', true);
      })
      .finally(function () {
        updateToolbar();
      });
  });

  loadBalance();
  loadInvestors();
})();
</script>
